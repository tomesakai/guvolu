syntax = "proto3";

package factor.common.v1;

option java_multiple_files = true;

message ContractMeta {
  string schema_name = 1;
  uint32 schema_version = 2;
  bytes event_id = 3;          // exactly 16 or 32 bytes under producer contract
  bytes correlation_id = 4;
  bytes causation_id = 5;
  int64 created_at_ns = 6;     // UTC epoch nanoseconds
  bytes payload_sha256 = 7;
  string producer = 8;
  string producer_version = 9;
  string idempotency_key = 10;
}

message Hash256 {
  bytes value = 1;             // exactly 32 bytes
}

message FixedDecimal {
  sint64 mantissa = 1;
  sint32 scale = 2;            // value = mantissa * 10^(-scale)
}

message TimeRange {
  int64 start_ns = 1;          // inclusive
  int64 end_ns = 2;            // exclusive
}

message ArtifactRef {
  Hash256 sha256 = 1;
  uint64 size_bytes = 2;
  string media_type = 3;
  string schema_name = 4;
  uint32 schema_version = 5;
  string locator = 6;          // opaque URI/handle; hash is authoritative
  string compression = 7;
}

message KeyValue {
  string key = 1;
  string value = 2;
}

message ContractError {
  ContractMeta meta = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
  string severity = 5;
  repeated KeyValue details = 6;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_QUEUED = 1;
  OPERATION_RUNNING = 2;
  OPERATION_SUCCEEDED = 3;
  OPERATION_FAILED = 4;
  OPERATION_CANCEL_REQUESTED = 5;
  OPERATION_CANCELLED = 6;
}

message OperationRef {
  ContractMeta meta = 1;
  Hash256 operation_id = 2;
  OperationStatus status = 3;
  string operation_kind = 4;
  double progress_fraction = 5;    // [0,1], advisory only
  repeated ArtifactRef results = 6;
  repeated ContractError errors = 7;
  int64 started_at_ns = 8;
  int64 finished_at_ns = 9;
}

message CommandAck {
  ContractMeta meta = 1;
  bool accepted = 2;
  string command_id = 3;
  repeated ContractError errors = 4;
}
